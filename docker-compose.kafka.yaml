version: "3.8"

networks:
  kafka-net:
    driver: bridge

volumes:
  zk1-data:
  zk2-data:
  zk3-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:

services:

  # ============================================================
  # ZOOKEEPER 1
  # ============================================================
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.4.4
    hostname: zookeeper-1
    container_name: zookeeper-1
    networks:
      - kafka-net

    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

    ports:
      - "22181:2181"

    volumes:
      - zk1-data:/var/lib/zookeeper/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"
        ]
      interval: 10s
      timeout: 5s
      retries: 12


  # ============================================================
  # ZOOKEEPER 2
  # ============================================================
  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.4.4
    hostname: zookeeper-2
    container_name: zookeeper-2
    networks:
      - kafka-net

    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

    ports:
      - "32181:2181"

    volumes:
      - zk2-data:/var/lib/zookeeper/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"
        ]
      interval: 10s
      timeout: 5s
      retries: 12


  # ============================================================
  # ZOOKEEPER 3
  # ============================================================
  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.4.4
    hostname: zookeeper-3
    container_name: zookeeper-3
    networks:
      - kafka-net

    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

    ports:
      - "42181:2181"

    volumes:
      - zk3-data:/var/lib/zookeeper/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"
        ]
      interval: 10s
      timeout: 5s
      retries: 12


  # ============================================================
  # KAFKA BROKER 1
  # ============================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.4.4
    hostname: kafka-1
    container_name: kafka-1
    networks:
      - kafka-net

    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3

    ports:
      - "29092:29092"

    volumes:
      - kafka1-data:/var/lib/kafka/data

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST}:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 18


  # ============================================================
  # KAFKA BROKER 2
  # ============================================================
  kafka-2:
    image: confluentinc/cp-kafka:7.4.4
    hostname: kafka-2
    container_name: kafka-2
    networks:
      - kafka-net

    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3

    ports:
      - "39092:39092"

    volumes:
      - kafka2-data:/var/lib/kafka/data

    environment:
      KAFKA_BROKER_ID: 2

      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:39092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST}:39092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 18


  # ============================================================
  # KAFKA BROKER 3
  # ============================================================
  kafka-3:
    image: confluentinc/cp-kafka:7.4.4
    hostname: kafka-3
    container_name: kafka-3
    networks:
      - kafka-net

    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3

    ports:
      - "49092:49092"

    volumes:
      - kafka3-data:/var/lib/kafka/data

    environment:
      KAFKA_BROKER_ID: 3

      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:49092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST}:49092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 18


  # ============================================================
  # KAFKA UI
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - kafka-net

    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-aws
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      DYNAMIC_CONFIG_ENABLED: "true"


  # ============================================================
  # KAFKA TOPIC INITIALIZATION
  # ============================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka-init
    networks:
      - kafka-net

    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        echo "Esperando a que Kafka esté disponible..."

        kafka-topics \
          --bootstrap-server kafka-1:9092 \
          --create \
          --if-not-exists \
          --topic transacciones-bancarias \
          --partitions 3 \
          --replication-factor 3

        echo "Topic transacciones-bancarias creado/verificado."

        kafka-topics \
          --bootstrap-server kafka-1:9092 \
          --describe \
          --topic transacciones-bancarias

        echo "Inicialización de Kafka completada."