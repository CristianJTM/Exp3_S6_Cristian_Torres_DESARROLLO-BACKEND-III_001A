name: Deploy Kafka Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy-kafka:
    runs-on: ubuntu-latest
    
    steps:
    
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
    
      # 2. Configurar la clave SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
    
      # 3. Copiar docker-compose.kafka.yaml a la instancia EC2
      - name: Copy Kafka Compose to EC2
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            docker-compose.kafka.yaml \
            ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }}:~/banco-xyz-kafka/docker-compose.kafka.yaml
    
      # 4. Desplegar Kafka en Amazon Linux 2023
      - name: Deploy Kafka infrastructure
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'
    
            cd ~/banco-xyz-kafka
    
            # Crear configuración de entorno dentro de EC2
            echo "KAFKA_ADVERTISED_HOST=${{ secrets.EC2_HOST }}" > .env
    
            # Validar el Docker Compose
            docker-compose -f docker-compose.kafka.yaml config
    
            # Detener la versión anterior
            docker-compose -f docker-compose.kafka.yaml down
    
            # Descargar las imágenes actualizadas
            docker-compose -f docker-compose.kafka.yaml pull
    
            # Levantar la infraestructura Kafka
            docker-compose -f docker-compose.kafka.yaml up -d
    
            # Mostrar estado de los contenedores
            docker-compose -f docker-compose.kafka.yaml ps
    
          EOF
